name: Actualizar productos
# Corre las consultas agregadas de consultas.json y guarda tablas pequeñas
# listas para tableros y piezas. Todos los días o a mano.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"   # 06:00 hora de Colombia
permissions:
  contents: write
jobs:
  productos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      SOCRATA_KEY_ID: ${{ secrets.SOCRATA_KEY_ID }}
      SOCRATA_KEY_SECRET: ${{ secrets.SOCRATA_KEY_SECRET }}
      SOCRATA_TIMEOUT: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u extractor_datosgov.py consultas --config consultas.json --salida datos/productos
      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Productos $(date -u +%F)"
          git push
