name: Catalogo y diccionario
# Descarga el catálogo de datos.gov.co, asigna ids a los datasets ancla
# y guarda el diccionario de columnas. Corre el día 1 de cada mes o a mano.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"   # 04:00 hora de Colombia
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python extractor_datosgov.py catalogo --salida datos/catalogo_api.csv
      - run: python extractor_datosgov.py cruzar --catalogo datos/catalogo_api.csv --ancla catalogo_ancla.csv --salida datos/ancla_con_ids.csv
      - name: Diagnóstico de conexión con datos.gov.co
        continue-on-error: true
        run: |
          mkdir -p datos
          ID=$(python -c "import csv;print(next((r['id'] for r in csv.DictReader(open('datos/ancla_con_ids.csv')) if r['id']),''))")
          echo "id de prueba: $ID"
          for u in "https://www.datos.gov.co/api/views/${ID}.json" "https://www.datos.gov.co/resource/${ID}.json?\$limit=1"; do
            curl -sS -o /dev/null -m 60 -w "$u -> %{http_code} en %{time_total}s\n" -H "X-App-Token: $SOCRATA_APP_TOKEN" "$u" || echo "$u -> fallo"
          done | tee datos/diagnostico_conexion.txt
      - name: Diccionario de columnas
        continue-on-error: true
        timeout-minutes: 30
        run: python -u extractor_datosgov.py metadatos --ids datos/ancla_con_ids.csv --salida datos/diccionario_ancla.csv
      - name: Guardar resultados en el repositorio
        if: always()
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Catálogo y diccionario $(date -u +%F)"
          git push
